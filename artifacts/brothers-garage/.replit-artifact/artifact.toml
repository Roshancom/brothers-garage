kind = "web"
previewPath = "/"
title = "Brothers Garage"
version = "1.0.0"
id = "artifacts/brothers-garage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25968

[services.development]
run = "pnpm --filter @workspace/brothers-garage run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brothers-garage", "run", "build" ]
publicDir = "artifacts/brothers-garage/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25968"
BASE_PATH = "/"
